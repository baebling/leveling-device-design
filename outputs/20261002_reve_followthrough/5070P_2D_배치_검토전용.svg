<svg xmlns="http://www.w3.org/2000/svg" width="640" height="790" viewBox="0 0 640 790" role="img" aria-labelledby="title desc">
  <title id="title">5070 P 속판 2D 예약영역 검토도, 제작용 아님</title>
  <desc id="desc">460×660 mm 플라스틱 속판에 전장품 외형과 임의 여유영역을 배치한 스크리닝. 실제 체결홀, 케이블, 팬, 도어 깊이 미검증.</desc>
  <rect width="640" height="790" fill="#f7f9fc"/>
  <text x="40" y="30" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#122032">5070 P / 460 × 660 mm — 2D screening only</text>
  <text x="40" y="50" font-family="Arial,sans-serif" font-size="13" fill="#a11919">NOT FOR FABRICATION · wiring, fan, fixing holes and door depth unverified</text>
