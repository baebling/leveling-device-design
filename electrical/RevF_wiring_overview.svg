<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <defs>
    <style>
      text { font-family: "Malgun Gothic", Arial, sans-serif; fill:#17365d; }
      .title { font-size:28px; font-weight:700; }
      .box { fill:#f7fbff; stroke:#2f75b5; stroke-width:2; rx:8; }
      .power { stroke:#c00000; stroke-width:4; fill:none; }
      .zero { stroke:#222; stroke-width:3; fill:none; }
      .signal { stroke:#2f75b5; stroke-width:3; fill:none; stroke-dasharray:8 5; }
      .label { font-size:17px; font-weight:600; }
      .small { font-size:14px; }
    </style>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c00000"/></marker>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f75b5"/></marker>
  </defs>
  <text x="55" y="50" class="title">Rev F 전원·통신 배선 개요 — 감독하 실내 자중 PoC</text>

  <rect x="60" y="100" width="160" height="70" class="box"/><text x="91" y="130" class="label">AC 220 V</text><text x="76" y="155" class="small">L / N / PE</text>
  <rect x="280" y="100" width="180" height="70" class="box"/><text x="301" y="130" class="label">EBE32FB</text><text x="300" y="155" class="small">2P 10 A / 30 mA</text>
  <rect x="520" y="90" width="210" height="90" class="box"/><text x="547" y="125" class="label">RSP-750-24</text><text x="563" y="153" class="small">24 V / 31.3 A</text>
  <path d="M220 135 H280 M460 135 H520" class="power" marker-end="url(#arrowR)"/>

  <rect x="800" y="85" width="170" height="65" class="box"/><text x="826" y="113" class="label">20 A ATO</text><text x="822" y="137" class="small">주 모터 퓨즈</text>
  <rect x="1030" y="85" width="240" height="65" class="box"/><text x="1052" y="113" class="label">Finder NO-1</text><text x="1048" y="137" class="small">22.32 / 25 A DC-1</text>
  <rect x="1030" y="210" width="240" height="65" class="box"/><text x="1065" y="239" class="label">DKD35 +MOTOR</text><text x="1085" y="263" class="small">3축 +24 V 분배</text>
  <path d="M730 115 H800 M970 115 H1030 M1150 150 V210" class="power" marker-end="url(#arrowR)"/>

  <g>
    <rect x="960" y="345" width="130" height="55" class="box"/><text x="986" y="377" class="label">10 A</text>
    <rect x="1140" y="330" width="190" height="85" class="box"/><text x="1180" y="365" class="label">DMC-1</text><text x="1169" y="392" class="small">ID1 / limit 6 A</text>
    <rect x="960" y="455" width="130" height="55" class="box"/><text x="986" y="487" class="label">10 A</text>
    <rect x="1140" y="440" width="190" height="85" class="box"/><text x="1180" y="475" class="label">DMC-2</text><text x="1169" y="502" class="small">ID2 / limit 6 A</text>
    <rect x="960" y="565" width="130" height="55" class="box"/><text x="986" y="597" class="label">10 A</text>
    <rect x="1140" y="550" width="190" height="85" class="box"/><text x="1180" y="585" class="label">DMC-3</text><text x="1169" y="612" class="small">ID3 / limit 6 A</text>
    <path d="M1150 275 V372 H960 M1090 372 H1140 M1150 275 V482 H960 M1090 482 H1140 M1150 275 V592 H960 M1090 592 H1140" class="power" marker-end="url(#arrowR)"/>
  </g>

  <rect x="70" y="265" width="160" height="60" class="box"/><text x="113" y="302" class="label">5 A ATO</text>
  <rect x="290" y="250" width="190" height="90" class="box"/><text x="318" y="285" class="label">WAGO +24 V</text><text x="318" y="314" class="small">제어분기</text>
  <path d="M625 180 V295 H230 M230 295 H290" class="power" marker-end="url(#arrowR)"/>

  <rect x="70" y="420" width="180" height="70" class="box"/><text x="103" y="451" class="label">E-stop NC</text><text x="98" y="476" class="small">코일만 차단</text>
  <rect x="310" y="405" width="200" height="100" class="box"/><text x="340" y="441" class="label">START NO</text><text x="336" y="469" class="small">∥ Finder NO-2</text><text x="337" y="492" class="small">자기유지</text>
  <rect x="580" y="420" width="190" height="70" class="box"/><text x="622" y="451" class="label">Finder Coil</text><text x="645" y="476" class="small">24 V</text>
  <path d="M385 340 V380 H160 V420 M250 455 H310 M510 455 H580" class="power" marker-end="url(#arrowR)"/>

  <rect x="70" y="610" width="225" height="85" class="box"/><text x="91" y="645" class="label">Portenta Machine</text><text x="135" y="673" class="label">Control</text>
  <rect x="370" y="610" width="180" height="85" class="box"/><text x="408" y="645" class="label">DDR-15G-12</text><text x="415" y="673" class="small">24 V → 12 V</text>
  <rect x="630" y="610" width="180" height="85" class="box"/><text x="669" y="645" class="label">ZMEC485DI</text><text x="663" y="673" class="small">Modbus gateway</text>
  <rect x="870" y="690" width="200" height="70" class="box"/><text x="912" y="721" class="label">HWT905 상부</text><text x="931" y="747" class="small">ID 0x50</text>
  <rect x="1130" y="690" width="200" height="70" class="box"/><text x="1172" y="721" class="label">HWT905 하부</text><text x="1191" y="747" class="small">ID 0x51</text>
  <path d="M385 340 V570 H180 V610 M385 570 H460 V610" class="power" marker-end="url(#arrowR)"/>
  <path d="M550 652 H630 M810 652 H970 V690 M970 725 H1130" class="signal" marker-end="url(#arrowB)"/>
  <text x="570" y="638" class="small">Ethernet</text><text x="884" y="671" class="small">RS-485 Modbus RTU</text>

  <path d="M295 675 H335 V785 H1270 V635" class="signal" marker-end="url(#arrowB)"/>
  <text x="350" y="812" class="small">Portenta J5 RS-485 전용 바이너리 버스 → DMC-1/2/3 (J7 사용 안 함)</text>
  <path d="M60 805 H1330" class="zero"/><text x="64" y="836" class="small">DKD35 0 V 공통 귀환</text>
</svg>
